name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write # for npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

      # Skips when this version was already published by hand from a dev
      # machine (no NPM_TOKEN secret needed for that path).
      - name: Publish to npm
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if npm view "claudemd-doctor@${VERSION}" version >/dev/null 2>&1; then
            echo "claudemd-doctor@${VERSION} already on npm; skipping publish."
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Extract this version's changelog section
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            BEGIN { found = 0 }
            /^## \[/ {
              if (found) exit
              if (index($0, "[" ver "]")) { found = 1; next }
            }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No matching CHANGELOG.md section for $VERSION; falling back to tag name." > release-notes.md
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          generate_release_notes: true
